name: Aegis release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: aegis-source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: prasanthece42/aegis-platform/.github/workflows/python-stack-release.yml@67e8f8bedcdbc69973b2191397f9c63fcfe4f6a8
    with:
      app-id: commerce-demo2
