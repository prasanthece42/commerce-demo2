name: Aegis release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: aegis-source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: prasanthece42/aegis-platform/.github/workflows/python-stack-release.yml@c41e97f9223abf71ff134ce5d63c805fcd8beb4e
    with:
      app-id: commerce-demo2
