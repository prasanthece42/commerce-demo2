name: Aegis CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aegis-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: prasanthece42/aegis-platform/.github/workflows/python-stack-ci.yml@67e8f8bedcdbc69973b2191397f9c63fcfe4f6a8
    with:
      app-id: commerce-demo2
      platforms: '["amd64","arm64"]'
