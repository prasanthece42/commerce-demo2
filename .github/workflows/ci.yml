name: Aegis CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aegis-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: prasanthece42/aegis-platform/.github/workflows/python-stack-ci.yml@c41e97f9223abf71ff134ce5d63c805fcd8beb4e
    with:
      app-id: commerce-demo2
      platforms: '["amd64","arm64"]'
