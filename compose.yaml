name: commerce-demo

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 192m
  cpus: 0.25
  environment: &environment
    DATABASE_URL: ${DATABASE_URL:?Supply the database URL}
    REDIS_URL: ${REDIS_URL:?Supply the authenticated Redis URL}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
    HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
    CART_TTL_SECONDS: ${CART_TTL_SECONDS:-3600}
    CATALOG_URL: http://catalog:8000
    INVENTORY_URL: http://inventory:8000
    CART_URL: http://cart:8000
    ORDERS_URL: http://orders:8000
    PAYMENTS_URL: http://payments:8000
    NOTIFICATIONS_URL: http://notifications:8000
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  catalog:
    <<: *service
    build: {context: ., args: {SERVICE: catalog}}
    environment: {<<: *environment, SERVICE_NAME: catalog}
  inventory:
    <<: *service
    build: {context: ., args: {SERVICE: inventory}}
    environment: {<<: *environment, SERVICE_NAME: inventory}
  cart:
    <<: *service
    build: {context: ., args: {SERVICE: cart}}
    environment: {<<: *environment, SERVICE_NAME: cart}
  orders:
    <<: *service
    build: {context: ., args: {SERVICE: orders}}
    environment: {<<: *environment, SERVICE_NAME: orders}
    deploy: {replicas: 2}
  payments:
    <<: *service
    build: {context: ., args: {SERVICE: payments}}
    environment: {<<: *environment, SERVICE_NAME: payments}
  notifications:
    <<: *service
    build: {context: ., args: {SERVICE: notifications}}
    environment: {<<: *environment, SERVICE_NAME: notifications}
  gateway:
    image: nginxinc/nginx-unprivileged@sha256:a6c4f61f456b85b8fdf7ec7ab28cc3e299440e6fb4a9dea520e5fd8fd440025e
    command: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:${GATEWAY_PORT:-18180}:8080"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    depends_on:
      catalog: {condition: service_healthy}
      inventory: {condition: service_healthy}
      cart: {condition: service_healthy}
      orders: {condition: service_healthy}
      payments: {condition: service_healthy}
      notifications: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U commerce -d commerce"]
      interval: 3s
      retries: 15
  redis:
    image: redis:7.4-alpine
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"}
    command:
      - /bin/sh
      - -ec
      - 'umask 077; printf "requirepass %s\nappendonly yes\nmaxmemory 96mb\nmaxmemory-policy noeviction\n" "$$REDIS_PASSWORD" > /data/redis.conf; exec redis-server /data/redis.conf'
    volumes: ["redis-data:/data"]
    mem_limit: 160m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      retries: 15

volumes:
  postgres-data:
  redis-data:
