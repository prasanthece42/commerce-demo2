pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=5s;
  server {
    listen 8080;
    client_max_body_size 16k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream off;
    location = / { default_type application/json; return 200 '{"app":"commerce-demo","services":6,"payments":"simulated","routes":"/api/{service}/docs"}'; }
    location = /health { return 200 'ok'; }
    location /api/catalog/ { set $backend catalog; rewrite ^/api/catalog/(.*)$ /$1 break; proxy_pass http://$backend:8000; }
    location /api/inventory/ { set $backend inventory; rewrite ^/api/inventory/(.*)$ /$1 break; proxy_pass http://$backend:8000; }
    location /api/cart/ { set $backend cart; rewrite ^/api/cart/(.*)$ /$1 break; proxy_pass http://$backend:8000; }
    location /api/orders/ { set $backend orders; rewrite ^/api/orders/(.*)$ /$1 break; proxy_pass http://$backend:8000; }
    location /api/payments/ { set $backend payments; rewrite ^/api/payments/(.*)$ /$1 break; proxy_pass http://$backend:8000; }
    location /api/notifications/ { set $backend notifications; rewrite ^/api/notifications/(.*)$ /$1 break; proxy_pass http://$backend:8000; }
  }
}
